[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-sentinel"
version = "0.1.0"
description = "Security log anomaly detection for SSH auth and web access logs: detection rules + Isolation Forest + a self-contained HTML report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hassan bin Tayyeb", email = "hasaantayyb1@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
log-sentinel = "logsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["logsentinel*"]

[tool.setuptools.package-data]
logsentinel = ["templates/*.html"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long regexes / f-strings read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
